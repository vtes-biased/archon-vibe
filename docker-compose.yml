services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archon
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: archon_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U archon" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://archon:archon_dev_password@db:5432/archon
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Test services (profile: test) ────────────────────────────────────
  # Fully isolated from the dev stack: a throwaway tmpfs-backed Postgres and
  # its own backend. `just test-e2e` never starts `db`/`backend` and never
  # writes the `postgres_data` volume, so it can't touch dev data.

  # Ephemeral test DB — data lives in RAM (tmpfs) and is destroyed with the
  # container. Never reuses the dev `postgres_data` volume.
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archon
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: archon_dev_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U archon" ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - test

  # Backend bound to the throwaway DB, VEKN sync off.
  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://archon:archon_dev_password@db-test:5432/archon
      ENVIRONMENT: development
      VEKN_SYNC_ENABLED: "false"
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - test

  populate-db:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://archon:archon_dev_password@db-test:5432/archon
      VEKN_SYNC_ENABLED: "false"
      E2E_FORCE: "1"  # db-test is guaranteed ephemeral/empty; allow the truncate
    depends_on:
      db-test:
        condition: service_healthy
    command: [ "sh", "-c", "uv sync --frozen --dev && uv run python backend/scripts/seed_e2e.py --output /shared/e2e-seed.json" ]
    volumes:
      - e2e-shared:/shared
    profiles:
      - test

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile.test
    environment:
      VITE_API_URL: http://backend-test:8000
      E2E_SEED_FILE: /shared/e2e-seed.json
    depends_on:
      populate-db:
        condition: service_completed_successfully
      backend-test:
        condition: service_healthy
    volumes:
      - e2e-shared:/shared:ro
      - ./playwright-report:/playwright-report
      - ./test-results:/test-results
    profiles:
      - test

volumes:
  postgres_data:
  e2e-shared:


