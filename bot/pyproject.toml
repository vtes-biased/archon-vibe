[project]
name = "archon-discord-bot"
dynamic = ["version"]   # derived from the git tag by hatch-vcs (see [tool.hatch.version])
description = "Discord bot for Archon VTES tournament management"
requires-python = ">=3.11"
dependencies = [
    "hikari>=2.2.0",
    "hikari-lightbulb>=3.0.0",
    "hikari-miru>=4.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    # Transcodes the webp tournament banner -> PNG for the Discord scheduled-event
    # cover (Discord's event-cover data-URI accepts only PNG/JPEG/GIF).
    "pillow>=10.0.0",
]

# Console entry point installed into the venv (used by the systemd unit).
[project.scripts]
archon-bot = "archon_bot.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version from the monorepo git tag. root = ".." points hatch-vcs at the repo
# root (this pyproject lives in bot/); bot + backend share one tag. CI builds
# this wheel with fetch-depth: 0; fallback_version covers no-.git build contexts.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", fallback_version = "0.0.0" }

# src-layout: the importable package lives at bot/src/archon_bot/.
[tool.hatch.build.targets.wheel]
packages = ["src/archon_bot"]
