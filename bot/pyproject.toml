[project]
name = "archon-discord-bot"
version = "0.1.0"
description = "Discord bot for Archon VTES tournament management"
requires-python = ">=3.11"
dependencies = [
    "hikari>=2.2.0",
    "hikari-lightbulb>=3.0.0",
    "hikari-miru>=4.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
