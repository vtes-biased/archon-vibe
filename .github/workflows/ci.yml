name: CI

# Fast pre-merge gate — the high-signal, deterministic checks, complementing the
# slow full-stack E2E suite (release.yml, on `v*` tags). Mirrors `just test` /
# `just lint-check`, split into independent parallel jobs so each layer fails and
# reports on its own: python lint, rust fmt+clippy, engine tests, backend pytest,
# frontend types. Jobs run concurrently, so total wall-clock = the slowest job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just lint-check` (python half): ruff lint + format check. No engine needed —
  # ruff never imports the code, so this is the cheapest job.
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: ruff check + format
        run: |
          uv run ruff check .
          uv run ruff format --check .

  # `just lint-check` (rust half): fmt + clippy. Split out from the test job so the
  # compile-bound `cargo test` doesn't sit behind ~11s of fmt+clippy on one runner —
  # the two now run on separate runners in parallel. Deps are shared via rust-cache
  # (same Cargo.lock), so the duplicate dep compile is a cache hit, not a rebuild.
  engine-lint:
    name: Rust engine (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Engine unit + doctests. The CI critical path: compile-bound (one test binary,
  # ~160 unit tests + doctests). `[profile.test] debug = line-tables-only` (Cargo.toml)
  # trims debuginfo codegen/link, the bulk of the cost. NOT nextest — it skips the
  # doctests in league.rs.
  engine-test:
    name: Rust engine (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test

  # `just test-backend`: build the PyO3 engine into the venv, then pytest against a
  # throwaway Postgres. conftest auto-creates the archon_test DB and the schema, so
  # no migration step — just point TEST_DATABASE_URL at the service.
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archon
          POSTGRES_PASSWORD: archon_dev_password
          POSTGRES_DB: archon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Build PyO3 engine into the venv
        run: uv run maturin develop --manifest-path engine/Cargo.toml
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql://archon:archon_dev_password@localhost:5432/archon_test
        run: uv run python -m pytest backend/tests/ -q

  # `just test` (frontend half): svelte-check. It resolves engine types from
  # engine/pkg (the gitignored WASM build output), so the WASM engine must be built
  # first; then `npm run check` runs the frontend codegen (geonames copy + paraglide
  # compile + svelte-kit sync) before the type-check — all three emit gitignored
  # sources svelte-check needs ($lib/paraglide, $lib/data/geonames, $types).
  frontend:
    name: Frontend type-check (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2   # prebuilt binary (~3s) vs ~80s source compile
        with:
          tool: wasm-pack
      - name: Build WASM engine (generates engine/pkg/*.d.ts)
        working-directory: engine
        # --dev: svelte-check only needs the generated .d.ts + JS bindings, not a
        # size-optimized wasm binary, so skip the release optimization passes.
        run: wasm-pack build --target web --dev -- --features wasm
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Cache the resolved node_modules tree (not just the npm download cache) so a
      # clean install is skipped entirely on a lockfile hit.
      - uses: actions/cache@v5
        id: node-modules
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install deps
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run check -- --threshold error
