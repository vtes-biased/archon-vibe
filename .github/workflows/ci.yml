name: CI

# Fast pre-merge gate — the high-signal, deterministic checks that run in minutes,
# complementing the slow full-stack E2E suite (e2e.yml). Mirrors `just test` /
# `just lint-check`, split into independent parallel jobs so each layer fails and
# reports on its own: python lint, the Rust engine, backend pytest, frontend types.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just lint-check` (python half): ruff lint + format check. No engine needed —
  # ruff never imports the code, so this is the cheapest job.
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: ruff check + format
        run: |
          uv run ruff check .
          uv run ruff format --check .

  # `just lint-check` (rust half) + engine unit tests. fmt/clippy/test share one
  # toolchain + cache, so they live together rather than fanning out further.
  engine:
    name: Rust engine (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # `just test-backend`: build the PyO3 engine into the venv, then pytest against a
  # throwaway Postgres. conftest auto-creates the archon_test DB and the schema, so
  # no migration step — just point TEST_DATABASE_URL at the service.
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archon
          POSTGRES_PASSWORD: archon_dev_password
          POSTGRES_DB: archon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install uv
        run: pip install uv
      - name: Build PyO3 engine into the venv
        run: uv run maturin develop --manifest-path engine/Cargo.toml
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql://archon:archon_dev_password@localhost:5432/archon_test
        run: uv run python -m pytest backend/tests/ -q

  # `just test` (frontend half): svelte-check. It resolves engine types from
  # engine/pkg (the gitignored WASM build output), so the WASM engine must be built
  # first; then `npm run check` runs the frontend codegen (geonames copy + paraglide
  # compile + svelte-kit sync) before the type-check — all three emit gitignored
  # sources svelte-check needs ($lib/paraglide, $lib/data/geonames, $types).
  frontend:
    name: Frontend type-check (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2   # prebuilt binary (~3s) vs ~80s source compile
        with:
          tool: wasm-pack
      - name: Build WASM engine (generates engine/pkg/*.d.ts)
        working-directory: engine
        run: wasm-pack build --target web --release -- --features wasm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps + type-check
        working-directory: frontend
        run: |
          npm ci
          npm run check -- --threshold error
