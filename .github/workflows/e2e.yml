name: E2E

# Runs the Playwright end-to-end suite against a fully isolated, ephemeral
# stack (docker-compose `test` profile: db-test on tmpfs + backend-test +
# populate-db seed + frontend-test runner). Nothing here touches real data —
# the test DB lives in RAM and dies with the container.
on:
  pull_request:
  # Kept deliberately: work also lands by pushing straight to main (trunk-based),
  # which fires no pull_request event — so this is the gate for direct-to-main
  # pushes, not a redundant re-run of an already-validated PR merge.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (isolated stack)
    runs-on: ubuntu-latest
    # The full stack builds WASM + two images then runs Playwright; cap the job so
    # a hung health-check or deadlocked test can't ride GitHub's 360-minute default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Build + run the isolated test stack in its own compose project; the
      # job's exit code is the Playwright runner's exit code.
      - name: Run E2E suite
        run: >-
          docker compose -p archon-vibe-e2e --profile test up --build
          --abort-on-container-exit --exit-code-from frontend-test
          frontend-test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Traces/screenshots/videos (Playwright outputDir) — only written on failure
      # and the most useful thing to pull down when a run goes red.
      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

      - name: Tear down
        if: ${{ always() }}
        # Own compose project → `down -v` only removes archon-vibe-e2e_* volumes,
        # never the dev postgres_data. (Moot in CI, but keeps the pattern safe.)
        run: docker compose -p archon-vibe-e2e --profile test down -v
