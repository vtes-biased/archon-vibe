name: Deploy

# Manual, approval-gated deploy to beta or production. The job binds to a GitHub
# Environment (beta | production) whose protection rules require a reviewer — the
# run pauses for approval before anything touches a server. Both environments are
# dispatch-only; nothing auto-deploys.
#
# beta deploys to the server-setup-managed host (frankfurt) as the `deploy` user;
# its DEPLOY_* config is pushed by server-setup's `just sync` / `just sync-key`.
# Per-Environment config (Settings → Environments → <env>):
#   Variables (not sensitive — a host IP and host public key are public):
#     DEPLOY_HOST       server hostname/IP (inventories ship placeholders)
#     DEPLOY_HOST_KEY   a known_hosts line for DEPLOY_HOST (e.g. `ssh-keyscan
#                       "$DEPLOY_HOST"`); its host field must match DEPLOY_HOST
#                       exactly or the connect fails (host_key_checking is on)
#   Secrets:
#     DEPLOY_SSH_KEY         deploy key (private half, LF newlines); public half in
#                            the deploy user's authorized_keys (server-setup sync-key)
#     ANSIBLE_VAULT_PASSWORD vault password for inventories/<env>/group_vars/all/vault.yml
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [beta, production]
        required: true
      release_tag:
        description: Release tag to deploy (blank = latest)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Runs before the approval gate (no environment) so a bad request never even
  # asks a reviewer. production must pin a tag — blank=latest would ship an
  # unreviewed release, and pinning means the reviewer sees the exact tag in the
  # run inputs.
  precheck:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit release_tag for production
        if: ${{ inputs.environment == 'production' && inputs.release_tag == '' }}
        run: |
          echo "::error::production deploys must pin an explicit release_tag (blank = latest is not allowed for production)."
          exit 1

  deploy:
    needs: precheck
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # ← approval gate (required reviewers)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass

      - name: Deploy
        working-directory: ansible
        env:
          # Token only lifts the GitHub API rate limit for the playbook's
          # release lookup (repo is public; asset downloads need no auth).
          GITHUB_TOKEN: ${{ github.token }}
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # beta rides the server-setup foundation (deploy-beta.yml); production
          # is the standalone target (deploy.yml, inventory dir `prod`).
          playbook=playbooks/deploy.yml; inventory=prod
          if [ "${{ inputs.environment }}" = beta ]; then
            playbook=playbooks/deploy-beta.yml; inventory=beta
          fi
          uv run --project .. --frozen --group dev ansible-playbook \
            --private-key ~/.ssh/deploy_key \
            -i "inventories/$inventory" "$playbook" \
            -e ansible_host="$DEPLOY_HOST" \
            ${RELEASE_TAG:+-e release_tag="$RELEASE_TAG"}

      - name: Cleanup secrets
        if: always()
        run: rm -f ansible/.vault_pass ~/.ssh/deploy_key ~/.ssh/known_hosts
