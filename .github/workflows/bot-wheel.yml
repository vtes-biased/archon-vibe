name: Bot Wheel

on:
  release:
    types: [published]   # attach the wheel to the published release
  workflow_dispatch: {}  # manual build → downloadable workflow artifact

permissions:
  contents: write

jobs:
  build-bot-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Build bot wheel
        working-directory: bot
        run: uv build --wheel --out-dir ../dist

      - name: Attach wheel to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber

      - name: Upload wheel as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: archon-bot-wheel
          path: dist/*.whl
