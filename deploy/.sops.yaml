creation_rules:
  # identifiers stay readable next to the secret they pair with
  - path_regex: secrets/beta\.sops\.yaml$
    unencrypted_regex: _(client_id|installation_id|public_keys?|username)$
    age: *beta
  - path_regex: secrets/beta/
    age: *beta
  - path_regex: secrets/prod\.sops\.yaml$
    unencrypted_regex: _(client_id|installation_id|public_keys?|username|access_key)$
    age: *prod
  - path_regex: secrets/prod/
    age: *prod
