<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#DC143C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VEKN Tournament Management - Web App" />
    <!-- Site-wide social card (Open Graph / Twitter). This static fallback ships
         to every route; per-tournament og:image is server-rendered for crawlers
         on /tournaments/{uid} (backend og.py + nginx UA-split). Image path is
         root-relative on purpose: the same build ships to every domain (see
         .env.production), crawlers resolve it against the page URL. The default
         image is the square 512 icon, so the card stays "summary" — a
         summary_large_image card would letterbox/crop a square asset. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Archon" />
    <meta property="og:description" content="VEKN Tournament Management - Web App" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Archon — VEKN Tournament Management" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Archon" />
    <meta name="twitter:description" content="VEKN Tournament Management - Web App" />
    <meta name="twitter:image" content="/icon-512.png" />
    <title>Archon</title>
    <script>
      // Anti-FOUC: apply theme class and meta theme-color before first paint
      (function() {
        var t = localStorage.getItem('theme');
        var light = t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
        var meta = document.querySelector('meta[name="theme-color"]');
        // These two hex values are the light/dark arms of --color-accent (app.css);
        // not reachable from CSS here, so keep them in sync if the brand hue changes.
        if (meta) meta.setAttribute('content', light ? '#A40F2D' : '#DC143C');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
