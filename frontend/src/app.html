<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      // One artifact serves both hosts, so build-time env vars are out: beta is
      // resolved from the hostname, and before first paint — the manifest is read
      // at install time, so a later swap would name the home-screen icon Archon.
      if (location.hostname === 'archon.krcg.org') {
        document.documentElement.dataset.env = 'beta';
        document.querySelector('link[rel=manifest]').href = '/manifest-beta.webmanifest';
        document.querySelector('link[rel=icon]').href = '/favicon-beta.svg';
        document.querySelector('link[rel=apple-touch-icon]').href = '/apple-touch-icon-beta.png';
        document.title = 'Archon Beta';
      }
    </script>
    <meta name="theme-color" content="#DC143C" />
    <!-- viewport-fit=cover: the bottom nav bleeds behind the home indicator
         instead of an inert letterbox strip, and un-insets the layout viewport's
         top in the installed PWA — hence the safe-t padding on the shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VEKN Tournament Management - Web App" />
    <!-- Static fallback OG card for routes with no UA-split. `/`, tournaments,
         leagues and help are server-rendered for crawlers (backend og.py + nginx),
         which is the only path on which a link preview can read the environment. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Archon" />
    <meta property="og:description" content="VEKN Tournament Management - Web App" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Archon — VEKN Tournament Management" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Archon" />
    <meta name="twitter:description" content="VEKN Tournament Management - Web App" />
    <meta name="twitter:image" content="/icon-512.png" />
    <title>Archon</title>
    <script>
      // Legacy archon's cached 308 / -> /index.html strands returning users on a
      // routeless path. replaceState, not a redirect: / would re-hit the 308 and loop.
      if (location.pathname === '/index.html')
        history.replaceState(null, '', '/' + location.search + location.hash);
    </script>
    <script>
      // Anti-FOUC: apply theme class and meta theme-color before first paint
      (function() {
        var t = localStorage.getItem('theme');
        var light = t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
        var meta = document.querySelector('meta[name="theme-color"]');
        // These two hex values are the light/dark arms of --color-accent (app.css);
        // not reachable from CSS here, so keep them in sync if the brand hue changes.
        if (meta) meta.setAttribute('content', light ? '#A40F2D' : '#DC143C');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
