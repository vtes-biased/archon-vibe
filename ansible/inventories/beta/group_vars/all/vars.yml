---
# Secrets live in vault.yml and are referenced via {{ vault_* }} below.

# Beta runs alongside the legacy `archon` on the server-setup frankfurt host, so
# everything is namespaced `new_archon` to avoid collisions (user, paths, db,
# services). service_name flows to the shared nginx_site role.
service_name: new_archon         # shared identifier (nginx_site tag, db name)
archon_user: new_archon          # unprivileged runtime user (== db role for PG peer auth)
archon_group: new_archon
contact_email: "lionel.panhaleux@gmail.com"

domain_main: archon.krcg.org
domain_bot: bot.archon.krcg.org
domain_api: api.archon.krcg.org
site_url_base: "https://{{ domain_main }}"

# Canonical Terms/Privacy URLs, also set in the Discord Developer Portal
# (General Information -> Terms of Service URL + Privacy Policy URL).
legal_terms_url: "{{ site_url_base }}/legal/terms"
legal_privacy_url: "{{ site_url_base }}/legal/privacy"

# 8007 is taken by the co-located legacy-archon beta's uvicorn on this box, so
# beta uses the +8 pair (8008/9008); the whole 8xxx/9xxx band is otherwise free.
backend_port: 8008
bot_port: 9008                    # paired with backend_port at +8 for this env
api_port: 7008                    # same +8 pairing, one band down

opt_root: /opt/new_archon
backend_site_root: "{{ opt_root }}/backend"
bot_site_root: "{{ opt_root }}/bot"
frontend_site_root: /var/www/new_archon
bot_state_dir: /var/lib/new_archon-bot
env_dir: /etc/new_archon
app_lib_dir: /var/lib/new_archon          # backend snapshots etc. (created by tasks/app_user.yml)

backend_service: new-archon-backend
bot_service: new-archon-bot
api_service: new-archon-public-api

# Python is managed by uv, same exact version on both envs, independent of the
# distro. PostgreSQL comes from the server-setup foundation here (distro
# major); archon's own postgresql role never runs on beta.
python_version: "3.14"
uv_python_install_dir: /opt/uv/python

db_name: new_archon
db_user: new_archon
db_password: "{{ vault_db_password }}"

backend_env:
  PYTHONOPTIMIZE: 1
  ENVIRONMENT: beta
  SITE_URL_BASE: "{{ site_url_base }}"
  FRONTEND_URL: "{{ site_url_base }}"
  API_BASE_URL: "{{ site_url_base }}"
  DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@/{{ db_name }}?host=/var/run/postgresql"
  MAIL_SERVER: smtp.gmail.com
  MAIL_PORT: 587
  MAIL_USE_TLS: "true"
  MAIL_USERNAME: codex.of.the.damned@gmail.com
  MAIL_FROM: codex.of.the.damned@gmail.com
  MAIL_FROM_NAME: "Archon Beta"
  MAIL_PASSWORD: "{{ vault_mail_password }}"
  JWT_SECRET: "{{ vault_jwt_secret }}"
  # backend uses CLIENTID/SECRET, not CLIENT_ID/CLIENT_SECRET.
  DISCORD_CLIENTID: "{{ vault_discord_client_id }}"
  DISCORD_SECRET: "{{ vault_discord_client_secret }}"
  DISCORD_REDIRECT_URI: "{{ site_url_base }}/auth/discord/callback"
  DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token }}"
  DISCORD_INSTALL_URL: ""
  WEBAUTHN_RP_ID: "{{ domain_main }}"
  WEBAUTHN_RP_NAME: "Archon Beta"
  WEBAUTHN_ORIGIN: "{{ site_url_base }}"
  VEKN_SYNC_ENABLED: "true"
  VEKN_SYNC_INTERVAL_HOURS: 24
  TWDA_SYNC_ENABLED: "true"
  VEKN_API_BASE_URL: "https://www.vekn.net/api"
  VEKN_API_USERNAME: "{{ vault_vekn_username }}"
  VEKN_API_PASSWORD: "{{ vault_vekn_password }}"
  VEKN_PUSH: "false"           # beta does not push results back to VEKN
  # Per-env keypair (beta and prod must NOT share). Rotating it invalidates
  # every existing browser subscription.
  VAPID_PUBLIC_KEY: "{{ vault_vapid_public_key | default('') }}"
  VAPID_PRIVATE_KEY: "{{ vault_vapid_private_key | default('') }}"
  VAPID_SUBJECT: "mailto:{{ contact_email }}"
  SNAPSHOT_DIR: "{{ app_lib_dir }}/snapshots"
  TWDA_GITHUB_CLIENT_ID: "{{ vault_twda_github_client_id | default('') }}"
  TWDA_GITHUB_INSTALLATION_ID: "{{ vault_twda_github_installation_id | default('') }}"
  TWDA_GITHUB_FORK_INSTALLATION_ID: "{{ vault_twda_github_fork_installation_id | default('') }}"
  TWDA_GITHUB_FORK_OWNER: "vtes-biased"
  # PRIVATE_KEY is the runtime PEM path — derived from env_dir so it always matches
  # where the role copies the vault-delivered .pem.
  TWDA_GITHUB_PRIVATE_KEY: "{{ env_dir }}/twda_github_app.pem"
  FEEDBACK_GITHUB_CLIENT_ID: "{{ vault_feedback_github_client_id | default('') }}"
  FEEDBACK_GITHUB_INSTALLATION_ID: "{{ vault_feedback_github_installation_id | default('') }}"
  # PRIVATE_KEY: env_dir-derived PEM path (see TWDA note above).
  FEEDBACK_GITHUB_PRIVATE_KEY: "{{ env_dir }}/feedback_github_app.pem"
  # Distinct from the two GitHub Apps above: a client secret, no private key.
  # Unset client id -> the "Link GitHub" button degrades to a not_configured toast.
  GITHUB_OAUTH_CLIENT_ID: "{{ vault_github_oauth_client_id | default('') }}"
  GITHUB_OAUTH_SECRET: "{{ vault_github_oauth_secret | default('') }}"
  GITHUB_OAUTH_REDIRECT_URI: "{{ site_url_base }}/auth/github/callback"

# The public read API runs as a second unit off the same wheel and venv, so its
# environment is deliberately derived from the app's: one JWT secret verifies a
# token minted by the other, and /v1/export serves the snapshot the app writes.
public_api_env:
  PYTHONOPTIMIZE: 1
  # Both appear in the reference page: the profile link where a client is
  # registered, and this host, whose vhost proxies /oauth/token to the app.
  SITE_URL_BASE: "{{ site_url_base }}"
  PUBLIC_API_URL_BASE: "https://{{ domain_api }}"
  DATABASE_URL: "{{ backend_env.DATABASE_URL }}"
  JWT_SECRET: "{{ backend_env.JWT_SECRET }}"
  SNAPSHOT_DIR: "{{ backend_env.SNAPSHOT_DIR }}"

bot_env:
  PYTHONOPTIMIZE: 1
  ARCHON_URL: "http://127.0.0.1:{{ backend_port }}"
  ARCHON_FRONTEND_URL: "{{ site_url_base }}"
  DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token }}"
  OAUTH_CLIENT_ID: "{{ vault_bot_oauth_client_id }}"
  OAUTH_CLIENT_SECRET: "{{ vault_bot_oauth_client_secret }}"
  OAUTH_REDIRECT_URI: "https://{{ domain_bot }}/oauth/callback"
  CALLBACK_HOST: "127.0.0.1"
  CALLBACK_PORT: "{{ bot_port }}"
  TOKEN_DB_PATH: "{{ bot_state_dir }}/tokens.db"
