---
# ----------------------------------------------------------------------------
# Production environment variables (non-secret).
# Secrets live in vault.yml and are referenced via {{ vault_* }} below.
# ----------------------------------------------------------------------------

# --- identity -------------------------------------------------------------
admin_user: lpanhaleux
archon_user: archon
archon_group: archon
contact_email: "lionel.panhaleux@gmail.com"

# --- domains --------------------------------------------------------------
domain_main: archon.vekn.net
domain_bot: bot.archon.vekn.net
site_url_base: "https://{{ domain_main }}"

# --- legal page URLs ------------------------------------------------------
# Canonical Terms / Privacy URLs. Set these in the Discord Developer Portal
# (General Information -> Terms of Service URL + Privacy Policy URL); kept here
# as the source of truth and for any future automation.
legal_terms_url: "{{ site_url_base }}/legal/terms"
legal_privacy_url: "{{ site_url_base }}/legal/privacy"

# --- ports ----------------------------------------------------------------
backend_port: 8007
bot_port: 9007

# --- filesystem paths -----------------------------------------------------
opt_root: /opt/archon
backend_site_root: "{{ opt_root }}/backend"
bot_site_root: "{{ opt_root }}/bot"
frontend_site_root: /var/www/archon
bot_state_dir: /var/lib/archon-bot
env_dir: /etc/archon

# --- service names --------------------------------------------------------
backend_service: archon-backend
bot_service: archon-bot
# Legacy archon stack sharing the vekn.net VPS during the parallel run; it
# writes to the same PG cluster, so migrate_postgres.yml must stop/start it
# around the dump + port swap. Decommissioned at Phase 4.
legacy_web_service: archon_web

# --- versions -------------------------------------------------------------
# PostgreSQL pinned via PGDG repo. Python is managed by uv (downloaded from
# python-build-standalone) — identical on prod and beta.
postgresql_version: 17
python_version: "3.14"
uv_python_install_dir: /opt/uv/python

# --- database -------------------------------------------------------------
# Distinct role from legacy archon's `archon` PG role: both stacks share one
# PG17 cluster during the parallel run, and reusing `archon` would reset its
# password and lock legacy out. db_name `archon` (≠ legacy `archondb`) is safe.
db_name: archon
db_user: archonvibe
db_password: "{{ vault_db_password }}"

# --- legacy-archon merge (parallel run; remove at Phase-4 decommission) ----
# Reads legacy `archondb` (role `archon`) over the socket via peer auth (the unit
# runs as OS user `archon`) and merges rich data into the vekn-seeded copies. No
# legacy password needed; the new-db write uses the archonvibe scram cred.
legacy_sync_enabled: true
legacy_db_user: archon
legacy_db_name: archondb
merge_backup_dir: /var/lib/archon/merge-backups
legacy_sync_oncalendar: "*-*-* 04:00:00"

# --- backend env vars -----------------------------------------------------
backend_env:
  PYTHONOPTIMIZE: 1
  ENVIRONMENT: production
  SITE_URL_BASE: "{{ site_url_base }}"
  FRONTEND_URL: "{{ site_url_base }}"
  API_BASE_URL: "{{ site_url_base }}"
  DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@/{{ db_name }}?host=/var/run/postgresql"
  # --- mail ---------------------------------------------------------------
  MAIL_SERVER: smtp.gmail.com
  MAIL_PORT: 587
  MAIL_USE_TLS: "true"
  MAIL_USERNAME: codex.of.the.damned@gmail.com
  MAIL_FROM: codex.of.the.damned@gmail.com
  MAIL_FROM_NAME: "Archon"
  MAIL_PASSWORD: "{{ vault_mail_password }}"
  # --- auth ---------------------------------------------------------------
  JWT_SECRET: "{{ vault_jwt_secret }}"
  # --- discord (note: backend uses CLIENTID/SECRET, not CLIENT_ID/CLIENT_SECRET)
  DISCORD_CLIENTID: "{{ vault_discord_client_id }}"
  DISCORD_SECRET: "{{ vault_discord_client_secret }}"
  DISCORD_REDIRECT_URI: "{{ site_url_base }}/auth/discord/callback"
  DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token }}"
  DISCORD_INSTALL_URL: "https://discord.com/oauth2/authorize?client_id=1495034668469194864"
  # --- passkeys / WebAuthn ------------------------------------------------
  WEBAUTHN_RP_ID: "{{ domain_main }}"
  WEBAUTHN_RP_NAME: "Archon"
  WEBAUTHN_ORIGIN: "{{ site_url_base }}"
  # --- VEKN sync + push ---------------------------------------------------
  VEKN_SYNC_ENABLED: "true"
  VEKN_SYNC_INTERVAL_HOURS: 24
  VEKN_API_BASE_URL: "https://www.vekn.net/api"
  VEKN_API_USERNAME: "{{ vault_vekn_username }}"
  VEKN_API_PASSWORD: "{{ vault_vekn_password }}"
  VEKN_PUSH: "{{ vekn_push_enabled | default('true') }}"   # prod-final on; phase-1 override gates it off
  VEKN_PUSH_INTERVAL_HOURS: 1
  # --- Web Push / VAPID ---------------------------------------------------
  # Per-env keypair (beta and prod must NOT share). Both keys live in vault so
  # they rotate atomically; default('') keeps push a graceful no-op until set.
  # Rotating the keypair invalidates every existing browser subscription.
  VAPID_PUBLIC_KEY: "{{ vault_vapid_public_key | default('') }}"
  VAPID_PRIVATE_KEY: "{{ vault_vapid_private_key | default('') }}"
  VAPID_SUBJECT: "mailto:{{ contact_email }}"
  # --- misc ---------------------------------------------------------------
  SNAPSHOT_DIR: /var/lib/archon/snapshots
  TWDA_GITHUB_CLIENT_ID: "{{ vault_twda_github_client_id | default('') }}"
  TWDA_GITHUB_INSTALLATION_ID: "{{ vault_twda_github_installation_id | default('') }}"
  # PRIVATE_KEY is the runtime PEM path — derived from env_dir so it always matches
  # where the role copies the vault-delivered .pem (a hardcoded path drifts per-env).
  TWDA_GITHUB_PRIVATE_KEY: "{{ env_dir }}/twda_github_app.pem"
  # In-app feedback -> GitHub issues. Dedicated GitHub App, Issues:write on this repo.
  FEEDBACK_GITHUB_CLIENT_ID: "{{ vault_feedback_github_client_id | default('') }}"
  FEEDBACK_GITHUB_INSTALLATION_ID: "{{ vault_feedback_github_installation_id | default('') }}"
  # PRIVATE_KEY: env_dir-derived PEM path (see TWDA note above).
  FEEDBACK_GITHUB_PRIVATE_KEY: "{{ env_dir }}/feedback_github_app.pem"
  # User-facing GitHub OAuth App (profile account-linking). Distinct from the two
  # GitHub Apps above: a client secret, no private key. Unset client id -> the
  # "Link GitHub" button degrades to a not_configured toast.
  GITHUB_OAUTH_CLIENT_ID: "{{ vault_github_oauth_client_id | default('') }}"
  GITHUB_OAUTH_SECRET: "{{ vault_github_oauth_secret | default('') }}"
  GITHUB_OAUTH_REDIRECT_URI: "{{ site_url_base }}/auth/github/callback"

# --- bot env vars ---------------------------------------------------------
bot_env:
  PYTHONOPTIMIZE: 1
  ARCHON_URL: "http://127.0.0.1:{{ backend_port }}"
  ARCHON_FRONTEND_URL: "{{ site_url_base }}"
  DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token }}"
  OAUTH_CLIENT_ID: "{{ vault_bot_oauth_client_id }}"
  OAUTH_CLIENT_SECRET: "{{ vault_bot_oauth_client_secret }}"
  OAUTH_REDIRECT_URI: "https://{{ domain_bot }}/oauth/callback"
  CALLBACK_HOST: "127.0.0.1"
  CALLBACK_PORT: "{{ bot_port }}"
  TOKEN_DB_PATH: "{{ bot_state_dir }}/tokens.db"
