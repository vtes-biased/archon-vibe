---
# r.site_root         required (backend install dir — the merge runs from its venv)
# r.user              required (runtime unix user; peer-auths into legacy PG)
# r.group             required (runtime unix group)
# r.legacy_db_user    required (legacy PG role, read over the socket)
# r.legacy_db_name    required (legacy database, e.g. archondb)
# r.new_db_user       required (archon-vibe PG role)
# r.new_db_name       required (archon-vibe database)
# r.new_db_password   required (scram cred for r.new_db_user; must be non-empty)
# r.service_name      optional (default below)
# r.script_src        optional (default below: this repo's merge script)
# r.env_dir           optional (default below)
# r.merge_backup_dir  optional (default below; holds the pre-merge pg_dump)
# r.oncalendar        optional (default below)
r: {}
legacy_sync_service_name_default: archon-legacy-sync
legacy_sync_script_src_default: "{{ role_path }}/../../../backend/scripts/migrate_from_archon.py"
legacy_sync_env_dir_default: /etc/archon
legacy_sync_merge_backup_dir_default: /var/lib/archon/merge-backups
legacy_sync_oncalendar_default: "*-*-* 04:00:00"
