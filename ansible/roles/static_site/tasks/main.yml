---
- name: Assert required inputs
  ansible.builtin.assert:
    that:
      - r.site_root is defined
      - r.dist_src is defined
      - r.owner is defined
      - r.group is defined
      # server_name + backend_port drive the nginx vhost — only required when this
      # role manages nginx (prod). Beta sets manage_nginx=false and uses nginx_site.
      - (not (r.manage_nginx | default(true))) or (r.server_name is defined and r.backend_port is defined)
    fail_msg: "static_site role missing required r.* inputs"

- name: Set effective defaults
  ansible.builtin.set_fact:
    _backend_paths: "{{ r.backend_paths | default(static_site_backend_paths_default) }}"
    _sse_path: "{{ r.sse_path | default(static_site_sse_path_default) }}"
    _client_max_body: "{{ r.client_max_body | default(static_site_client_max_body_default) }}"
    _dist_dir: "{{ r.site_root }}/dist"

- name: Ensure dist directory exists
  ansible.builtin.file:
    path: "{{ _dist_dir }}"
    state: directory
    owner: "{{ r.owner }}"
    group: "{{ r.group }}"
    mode: "0755"

- name: Rsync built frontend dist to the host
  # No --chmod/--chown rsync_opts: macOS control nodes ship openrsync, which
  # rejects both flags — ownership is set by the task below instead.
  ansible.posix.synchronize:
    src: "{{ r.dist_src }}/"
    dest: "{{ _dist_dir }}/"
    delete: true
    recursive: true

- name: Own the deployed dist tree
  ansible.builtin.file:
    path: "{{ _dist_dir }}"
    state: directory
    owner: "{{ r.owner }}"
    group: "{{ r.group }}"
    recurse: true

- name: Render HTTPS vhost
  ansible.builtin.template:
    src: https.conf.j2
    dest: "/etc/nginx/sites-enabled/{{ r.server_name }}.https.conf"
    mode: "0644"
  when: r.manage_nginx | default(true)
  notify: Reload nginx (static_site)
