---
# Codify the /swapfile that keeps the tiny prod box off the OOM edge (both
# stacks + one PG cluster share ~945MB). Gated on whether the path is already
# active swap, so we never fallocate/mkswap/swapon a live swapfile — safe
# against the swap already added by hand. Steady state (swap active) is a
# clean no-op; the create/format branch only runs before first activation.
- name: List active swap devices
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: active_swaps
  changed_when: false
  check_mode: false

- name: Create swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ swapfile_size }} {{ swapfile_path }}"
    creates: "{{ swapfile_path }}"
  when: swapfile_path not in active_swaps.stdout

- name: Secure swapfile permissions
  ansible.builtin.file:
    path: "{{ swapfile_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swapfile
  ansible.builtin.command:
    cmd: "mkswap {{ swapfile_path }}"
  when: swapfile_path not in active_swaps.stdout
  changed_when: true

- name: Activate swapfile
  ansible.builtin.command:
    cmd: "swapon {{ swapfile_path }}"
  when: swapfile_path not in active_swaps.stdout
  changed_when: true

- name: Persist swapfile in fstab
  ansible.posix.mount:
    path: none
    src: "{{ swapfile_path }}"
    fstype: swap
    opts: sw
    state: present

- name: Tune vm.swappiness (prefer RAM; swap is a safety net)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swappiness }}"
    sysctl_set: true
    state: present
    reload: true
