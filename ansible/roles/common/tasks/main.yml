---
# Swap first so the box has headroom before the heavier apt/python steps.
- name: Import swap tasks
  ansible.builtin.import_tasks: swap.yml
  when: swapfile_enabled | bool

- name: Import packages tasks
  ansible.builtin.import_tasks: packages.yml

- name: Import trim tasks
  ansible.builtin.import_tasks: trim.yml

# users before python: python.yml chowns /opt/uv/python to the archon group,
# which users.yml creates — reversed, the real run fails (chgrp: no such group).
- name: Import users tasks
  ansible.builtin.import_tasks: users.yml

- name: Import python tasks
  ansible.builtin.import_tasks: python.yml

- name: Import firewall tasks
  ansible.builtin.import_tasks: firewall.yml

- name: Import unattended-upgrades tasks
  ansible.builtin.import_tasks: unattended_upgrades.yml
