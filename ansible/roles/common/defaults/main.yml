---
# The role never reformats or re-activates an already-active swapfile —
# swapfile_size only applies on a fresh create.
swapfile_enabled: false
swapfile_path: /swapfile
swapfile_size: 1G
swappiness: 10

# Wheels-only deploy: no git/make/pip/venv/-dev toolchain needed here.
# state=present never uninstalls, so pruning this list only shapes fresh provisions.
common_base_packages:
  - acl
  - ca-certificates
  - certbot
  - curl
  - gnupg
  - libpq-dev
  - libpq5
  - nginx
  - python3
  - python3-psycopg2
  - rsync
  - ufw
  - unattended-upgrades

common_pruned_packages:
  - fwupd
  - modemmanager
  - multipath-tools
  - open-vm-tools
  - rsyslog
  - udisks2

journal_max_use: 256M
