---
# Swap safety-net for memory-constrained hosts (opt-in). The role never
# reformats or re-activates an already-active swapfile — swapfile_size only
# applies on a fresh create, so bumping it won't resize an existing file.
swapfile_enabled: false
swapfile_path: /swapfile
swapfile_size: 1G
swappiness: 10

common_base_packages:
  - acl
  - ca-certificates
  - certbot
  - curl
  - git
  - gnupg
  - libpq-dev
  - libpq5
  - make
  - nginx
  - python3
  - python3-certbot-nginx
  - python3-dev
  - python3-pip
  - python3-psycopg2
  - python3-venv
  - rsync
  - ufw
  - unattended-upgrades
