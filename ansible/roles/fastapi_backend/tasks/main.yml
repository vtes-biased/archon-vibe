---
- name: Assert required inputs
  ansible.builtin.assert:
    that:
      - r.service_name is defined
      - r.site_root is defined
      - r.port is defined
      - r.asgi_entrypoint is defined
      - r.python_version is defined
      - r.uv_python_install_dir is defined
      - r.user is defined
      - r.group is defined
      - r.backend_wheel_src is defined
      - r.engine_wheel_src is defined
      - r.requirements_src is defined
      - r.env is defined
    fail_msg: "fastapi_backend role missing required r.* inputs"

- name: Set effective env_dir
  ansible.builtin.set_fact:
    _env_dir: "{{ r.env_dir | default(fastapi_env_dir_default) }}"
    _wheels_dir: "{{ r.site_root }}/wheels"
    _venv_dir: "{{ r.site_root }}/.venv"
    _data_dir: "{{ r.data_dir | default(fastapi_data_dir_default) }}"

- name: Ensure site_root exists
  ansible.builtin.file:
    path: "{{ r.site_root }}"
    state: directory
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0755"

- name: Ensure wheels dir exists
  ansible.builtin.file:
    path: "{{ _wheels_dir }}"
    state: directory
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0755"

# Operator tooling run by hand against the live DB with the deployed venv. Not
# imported by the service — just saves an on-call run a checkout on the box.
- name: Ship backend ops scripts
  ansible.builtin.copy:
    src: "{{ r.ops_scripts_src }}"
    dest: "{{ r.site_root }}/scripts/"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0755"
  when: r.ops_scripts_src is defined

- name: Upload backend wheel
  ansible.builtin.copy:
    src: "{{ r.backend_wheel_src }}"
    dest: "{{ _wheels_dir }}/"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

- name: Upload engine wheel
  ansible.builtin.copy:
    src: "{{ r.engine_wheel_src }}"
    dest: "{{ _wheels_dir }}/"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

- name: Upload pinned requirements
  ansible.builtin.copy:
    src: "{{ r.requirements_src }}"
    dest: "{{ r.site_root }}/requirements.txt"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

# Without this, `uv venv --python X.Y` (run as the unprivileged service user)
# tries to download the interpreter into the root-owned install dir and dies EACCES.
- name: Ensure uv managed-python dir exists
  ansible.builtin.file:
    path: "{{ r.uv_python_install_dir }}"
    state: directory
    owner: root
    group: "{{ r.group }}"
    mode: "0755"

- name: Install uv-managed Python {{ r.python_version }}
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - python
      - install
      - "{{ r.python_version }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: _uv_python_install
  changed_when: "'Installed' in _uv_python_install.stderr"

- name: Detect existing venv Python version
  ansible.builtin.command:
    argv:
      - "{{ _venv_dir }}/bin/python"
      - -c
      - "import sys; print('{}.{}'.format(*sys.version_info[:2]))"
  register: _venv_pyver
  changed_when: false
  failed_when: false

# The next task's 'creates:' guard makes venv creation a one-time artifact, so
# a python_version bump would target the stale interpreter unless dropped here first.
- name: Remove venv when its Python differs from {{ r.python_version }}
  ansible.builtin.file:
    path: "{{ _venv_dir }}"
    state: absent
  when:
    - _venv_pyver.rc == 0
    - _venv_pyver.stdout | trim != r.python_version

- name: Create venv with uv-managed Python {{ r.python_version }}
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - venv
      - --python
      - "{{ r.python_version }}"
      - "{{ _venv_dir }}"
  args:
    creates: "{{ _venv_dir }}/bin/python"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  become: true
  become_user: "{{ r.user }}"

- name: Install pinned dependencies into venv
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - pip
      - install
      - --python
      - "{{ _venv_dir }}/bin/python"
      - --requirement
      - "{{ r.site_root }}/requirements.txt"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: uv_install_deps
  changed_when: "'Installed' in uv_install_deps.stdout or 'Prepared' in uv_install_deps.stdout"
  become: true
  become_user: "{{ r.user }}"
  notify: Restart backend service

- name: Install engine + backend wheels into venv (force reinstall)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - pip
      - install
      - --python
      - "{{ _venv_dir }}/bin/python"
      - --reinstall
      - "{{ _wheels_dir }}/{{ r.engine_wheel_src | basename }}"
      - "{{ _wheels_dir }}/{{ r.backend_wheel_src | basename }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: uv_install_wheels
  changed_when: true
  become: true
  become_user: "{{ r.user }}"
  notify: Restart backend service

- name: Ensure env dir exists
  ansible.builtin.file:
    path: "{{ _env_dir }}"
    state: directory
    owner: root
    group: "{{ r.group }}"
    mode: "0750"

- name: Render environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ _env_dir }}/{{ r.service_name }}.env"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  notify: Restart backend service

# Personal data (scraped NC/Prince contacts): delivered as a per-env ansible-vault
# file (r.officials_contacts_vault); fileglob no-ops when absent, so deploys never break.
- name: Deploy officials contacts (ansible-vault, optional)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _env_dir }}/officials_contacts.json"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', r.officials_contacts_vault | default('officials_contacts.json.vault')) }}"
  notify: Restart backend service

# Multi-line PEM can't ride in the systemd EnvironmentFile, so it's delivered
# as a per-env ansible-vault file (r.twda_key_vault) instead.
- name: Deploy TWDA GitHub App private key (ansible-vault, optional)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _env_dir }}/twda_github_app.pem"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', r.twda_key_vault | default('twda_github_app.pem.vault')) }}"
  notify: Restart backend service

# Same out-of-band delivery as the TWDA key above; a separate App/key so the
# two integrations stay isolated.
- name: Deploy feedback GitHub App private key (ansible-vault, optional)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _env_dir }}/feedback_github_app.pem"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', r.feedback_key_vault | default('feedback_github_app.pem.vault')) }}"
  notify: Restart backend service

- name: Render systemd unit
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ r.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart backend service

- name: Enable service
  ansible.builtin.systemd:
    name: "{{ r.service_name }}"
    enabled: true
    daemon_reload: true
