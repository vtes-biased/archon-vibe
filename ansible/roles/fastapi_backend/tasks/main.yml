---
- name: Assert required inputs
  ansible.builtin.assert:
    that:
      - r.service_name is defined
      - r.site_root is defined
      - r.port is defined
      - r.asgi_entrypoint is defined
      - r.python_version is defined
      - r.uv_python_install_dir is defined
      - r.user is defined
      - r.group is defined
      - r.backend_wheel_src is defined
      - r.engine_wheel_src is defined
      - r.requirements_src is defined
      - r.env is defined
    fail_msg: "fastapi_backend role missing required r.* inputs"

- name: Set effective env_dir
  ansible.builtin.set_fact:
    _env_dir: "{{ r.env_dir | default(fastapi_env_dir_default) }}"
    _wheels_dir: "{{ r.site_root }}/wheels"
    _venv_dir: "{{ r.site_root }}/.venv"
    _data_dir: "{{ r.data_dir | default(fastapi_data_dir_default) }}"

- name: Ensure site_root exists
  ansible.builtin.file:
    path: "{{ r.site_root }}"
    state: directory
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0755"

- name: Ensure wheels dir exists
  ansible.builtin.file:
    path: "{{ _wheels_dir }}"
    state: directory
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0755"

- name: Upload backend wheel
  ansible.builtin.copy:
    src: "{{ r.backend_wheel_src }}"
    dest: "{{ _wheels_dir }}/"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

- name: Upload engine wheel
  ansible.builtin.copy:
    src: "{{ r.engine_wheel_src }}"
    dest: "{{ _wheels_dir }}/"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

- name: Upload pinned requirements
  ansible.builtin.copy:
    src: "{{ r.requirements_src }}"
    dest: "{{ r.site_root }}/requirements.txt"
    owner: "{{ r.user }}"
    group: "{{ r.group }}"
    mode: "0644"
  notify: Restart backend service

# Beta has no bootstrap step (server-setup owns the foundation) and neither deploy
# playbook re-runs the common role on a python_version bump — so the uv-managed
# interpreter must be ensured here, as root, before any venv work. Without it,
# `uv venv --python X.Y` (run as the unprivileged service user) tries to download
# the interpreter into the root-owned install dir and dies with EACCES. Idempotent:
# `uv python install` is a no-op when the version is already present.
- name: Ensure uv managed-python dir exists
  ansible.builtin.file:
    path: "{{ r.uv_python_install_dir }}"
    state: directory
    owner: root
    group: "{{ r.group }}"
    mode: "0755"

- name: Install uv-managed Python {{ r.python_version }}
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - python
      - install
      - "{{ r.python_version }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: _uv_python_install
  changed_when: "'Installed' in _uv_python_install.stderr"

- name: Detect existing venv Python version
  ansible.builtin.command:
    argv:
      - "{{ _venv_dir }}/bin/python"
      - -c
      - "import sys; print('{}.{}'.format(*sys.version_info[:2]))"
  register: _venv_pyver
  changed_when: false
  failed_when: false

# The 'creates:' guard below makes venv creation a one-time artifact, so a
# python_version bump never rebuilds an existing venv. uv pip install then targets
# the stale interpreter and a requires-python>=N wheel fails to resolve. Drop the
# mismatched venv here so the next task recreates it; deps + wheels reinstall
# unconditionally afterwards, so a fresh venv is repopulated in full.
- name: Remove venv when its Python differs from {{ r.python_version }}
  ansible.builtin.file:
    path: "{{ _venv_dir }}"
    state: absent
  when:
    - _venv_pyver.rc == 0
    - _venv_pyver.stdout | trim != r.python_version

- name: Create venv with uv-managed Python {{ r.python_version }}
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - venv
      - --python
      - "{{ r.python_version }}"
      - "{{ _venv_dir }}"
  args:
    creates: "{{ _venv_dir }}/bin/python"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  become: true
  become_user: "{{ r.user }}"

- name: Install pinned dependencies into venv
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - pip
      - install
      - --python
      - "{{ _venv_dir }}/bin/python"
      - --requirement
      - "{{ r.site_root }}/requirements.txt"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: uv_install_deps
  changed_when: "'Installed' in uv_install_deps.stdout or 'Prepared' in uv_install_deps.stdout"
  become: true
  become_user: "{{ r.user }}"
  notify: Restart backend service

- name: Install engine + backend wheels into venv (force reinstall)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - pip
      - install
      - --python
      - "{{ _venv_dir }}/bin/python"
      - --reinstall
      - "{{ _wheels_dir }}/{{ r.engine_wheel_src | basename }}"
      - "{{ _wheels_dir }}/{{ r.backend_wheel_src | basename }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ r.uv_python_install_dir }}"
  register: uv_install_wheels
  changed_when: true
  become: true
  become_user: "{{ r.user }}"
  notify: Restart backend service

- name: Ensure env dir exists
  ansible.builtin.file:
    path: "{{ _env_dir }}"
    state: directory
    owner: root
    group: "{{ r.group }}"
    mode: "0750"

- name: Render environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ _env_dir }}/{{ r.service_name }}.env"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  notify: Restart backend service

# Personal data (scraped NC/Prince contacts). Provided as a per-env ansible-vault
# file (the caller passes r.officials_contacts_vault — e.g. officials_contacts.json.beta.vault,
# encrypted with that env's key; see role README). copy decrypts it to the runtime
# path the backend reads (OFFICIALS_CONTACTS_FILE in env.j2). fileglob → no-op when
# the file isn't present, so deploys never break and each env only ever touches its
# own variant (so a single per-env vault password suffices).
- name: Deploy officials contacts (ansible-vault, optional)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _env_dir }}/officials_contacts.json"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', r.officials_contacts_vault | default('officials_contacts.json.vault')) }}"
  notify: Restart backend service

# GitHub App private key for the TWDA importer (PEM). Multi-line, so it can't ride
# in the systemd EnvironmentFile — provided as a per-env ansible-vault file (the
# caller passes r.twda_key_vault — e.g. twda_github_app.pem.beta.vault, encrypted
# with that env's key). copy decrypts it to the runtime path TWDA_GITHUB_PRIVATE_KEY
# points at (twda.py reads the path when the value isn't inline PEM). fileglob →
# no-op when absent, so deploys never break and each env touches only its own variant.
- name: Deploy TWDA GitHub App private key (ansible-vault, optional)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _env_dir }}/twda_github_app.pem"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', r.twda_key_vault | default('twda_github_app.pem.vault')) }}"
  notify: Restart backend service

- name: Render systemd unit
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ r.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart backend service

- name: Enable service
  ansible.builtin.systemd:
    name: "{{ r.service_name }}"
    enabled: true
    daemon_reload: true
