---
# This file is the role's parameter contract. Every `r.*` key the tasks read is
# listed here and is either required — asserted in tasks/main.yml, so omission
# fails the play — or carries a `*_default` below that makes omission correct.
# r.service_name          required (e.g. archon-backend)
# r.site_root             required (install dir, e.g. /opt/archon/backend)
# r.port                  required (localhost port)
# r.python_version        required (uv-managed Python, e.g. "3.14")
# r.uv_python_install_dir required (where uv stores managed Pythons)
# r.user                  required (runtime unix user)
# r.group                 required (runtime unix group)
# r.backend_wheel_src     required (local path to the backend wheel)
# r.engine_wheel_src      required (local path to the PyO3 engine wheel)
# r.requirements_src      required (local path to pinned requirements.txt)
# r.env                   required (dict of KEY: value pairs)
# r.officials_contacts_vault required (per-env vault filename in files/, e.g.
#                            officials_contacts.json.beta.vault)
# r.twda_key_vault        required (per-env vault filename in files/)
# r.feedback_key_vault    required (per-env vault filename in files/)
# r.asgi_entrypoint       optional (default below)
# r.env_dir               optional (default below)
# r.data_dir              optional (writable state dir; default below.
#                          Must exist — systemd ProtectSystem=strict + ReadWritePaths needs it.)
# r.ops_scripts_src       optional (default below: this repo's backend/scripts/)
r: {}
fastapi_asgi_entrypoint_default: backend.src.main:app
fastapi_env_dir_default: /etc/archon
fastapi_data_dir_default: /var/lib/archon
fastapi_ops_scripts_src_default: "{{ role_path }}/../../../backend/scripts/"
