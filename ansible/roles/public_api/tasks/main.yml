---
- name: Assert required inputs
  ansible.builtin.assert:
    that:
      - r.service_name is defined
      - r.backend_service is defined
      - r.site_root is defined
      - r.venv_dir is defined
      - r.port is defined
      - r.user is defined
      - r.group is defined
      - r.env is defined
      - (not (r.manage_nginx | default(public_api_manage_nginx_default))) or (r.server_name is defined)
    fail_msg: "public_api role missing required r.* inputs"

- name: Set effective defaults
  ansible.builtin.set_fact:
    _env_dir: "{{ r.env_dir | default(public_api_env_dir_default) }}"
    _manage_nginx: "{{ r.manage_nginx | default(public_api_manage_nginx_default) }}"
    _zone: "{{ r.service_name | replace('-', '_') }}"

- name: Ensure env dir exists
  ansible.builtin.file:
    path: "{{ _env_dir }}"
    state: directory
    owner: root
    group: "{{ r.group }}"
    mode: "0750"

- name: Render public API environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ _env_dir }}/{{ r.service_name }}.env"
    owner: root
    group: "{{ r.group }}"
    mode: "0640"
  notify: Restart public API service

- name: Render systemd unit
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ r.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart public API service

- name: Enable public API service
  ansible.builtin.systemd:
    name: "{{ r.service_name }}"
    enabled: true
    daemon_reload: true

# limit_req_zone / limit_conn_zone are http-context directives: they cannot live
# in the vhost's server block, and a sites-enabled file is included inside http.
- name: Declare the throttle zones
  ansible.builtin.template:
    src: limits.conf.j2
    dest: "/etc/nginx/conf.d/{{ r.service_name }}-limits.conf"
    mode: "0644"
  when: _manage_nginx | bool
  notify: Reload nginx (public_api)

- name: Deploy public API HTTPS vhost
  ansible.builtin.template:
    src: https.conf.j2
    dest: "/etc/nginx/sites-enabled/{{ r.server_name }}.https.conf"
    mode: "0644"
  when: _manage_nginx | bool
  notify: Reload nginx (public_api)
