---
# Install the official PGDG apt repository so the exact PostgreSQL major
# version is available on both Debian 13 and Ubuntu 24.04.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install PGDG signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

# The deb822 repo below lands as pgdg.sources; drop the pre-migration one-line
# pgdg.list so apt doesn't see the same repo configured twice.
- name: Remove legacy one-line PGDG list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pgdg.list
    state: absent

# The next task (Install PostgreSQL, main.yml) runs apt with update_cache, so no
# explicit cache refresh is needed here.
- name: Add PGDG apt repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: /etc/apt/keyrings/postgresql.asc
    state: present
