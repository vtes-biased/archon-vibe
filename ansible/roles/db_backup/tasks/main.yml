---
# pg_dump -F c of every non-template DB, so a database added to the cluster is
# covered with no config change.
- name: Set effective defaults
  ansible.builtin.set_fact:
    _backup_dir: "{{ r.backup_dir | default(db_backup_backup_dir_default) }}"
    _retention_days: "{{ r.retention_days | default(db_backup_retention_days_default) }}"
    _exclude: "{{ r.exclude | default(db_backup_exclude_default) }}"
    _oncalendar: "{{ r.oncalendar | default(db_backup_oncalendar_default) }}"
    _check_oncalendar: "{{ r.check_oncalendar | default(db_backup_check_oncalendar_default) }}"
    _remote_enabled: "{{ r.remote_enabled | default(db_backup_remote_enabled_default) }}"
    _remote_bucket: "{{ r.remote_bucket | default(db_backup_remote_bucket_default) }}"
    _remote_endpoint: "{{ r.remote_endpoint | default(db_backup_remote_endpoint_default) }}"
    _remote_keep_daily: "{{ r.remote_keep_daily | default(db_backup_remote_keep_daily_default) }}"
    _remote_keep_weekly: "{{ r.remote_keep_weekly | default(db_backup_remote_keep_weekly_default) }}"
    _remote_keep_monthly: "{{ r.remote_keep_monthly | default(db_backup_remote_keep_monthly_default) }}"
    _remote_access_key: "{{ r.remote_access_key | default(db_backup_remote_access_key_default) }}"
    _remote_secret_key: "{{ r.remote_secret_key | default(db_backup_remote_secret_key_default) }}"
    _remote_restic_password: "{{ r.remote_restic_password | default(db_backup_remote_restic_password_default) }}"
    _healthcheck_url: "{{ r.healthcheck_url | default(db_backup_healthcheck_url_default) }}"
    _check_healthcheck_url: "{{ r.check_healthcheck_url | default(db_backup_check_healthcheck_url_default) }}"

- name: Assert remote backup secrets are present
  ansible.builtin.assert:
    that:
      - _remote_access_key | length > 0
      - _remote_secret_key | length > 0
      - _remote_restic_password | length > 0
      - _remote_bucket | length > 0
    fail_msg: >-
      db_backup_remote_enabled=true requires vault_remote_backup_access_key,
      vault_remote_backup_secret_key and vault_remote_backup_restic_password
      in vault.yml, and db_backup_remote_bucket in inventory
  when: _remote_enabled | bool

# rclone: pg-backup's orphan-repo scan (restic can't list bucket prefixes)
- name: Install restic + rclone
  ansible.builtin.apt:
    name:
      - restic
      - rclone
    state: present
  when: _remote_enabled | bool

- name: Ensure backup dir exists
  ansible.builtin.file:
    path: "{{ _backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Ensure backup config dir exists
  ansible.builtin.file:
    path: /etc/postgres-backup
    state: directory
    owner: root
    group: postgres
    mode: "0750"

- name: Write healthcheck ping URLs
  # Capability URLs (healthchecks.io-style ping UUIDs) — vault-held since the
  # repo is public; scripts no-op without the file (units load it with `-`).
  ansible.builtin.copy:
    content: |
      BACKUP_HEALTHCHECK_URL={{ _healthcheck_url }}
      CHECK_HEALTHCHECK_URL={{ _check_healthcheck_url }}
    dest: /etc/postgres-backup/healthcheck.env
    owner: root
    group: postgres
    mode: "0640"
  when: >-
    (_healthcheck_url | length > 0)
    or (_check_healthcheck_url | length > 0)
  no_log: true

- name: Write remote backup credentials
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ _remote_access_key }}
      AWS_SECRET_ACCESS_KEY={{ _remote_secret_key }}
      RESTIC_PASSWORD={{ _remote_restic_password }}
      RESTIC_REPOSITORY_BASE=s3:{{ _remote_endpoint }}/{{ _remote_bucket }}
      REMOTE_KEEP_DAILY={{ _remote_keep_daily }}
      REMOTE_KEEP_WEEKLY={{ _remote_keep_weekly }}
      REMOTE_KEEP_MONTHLY={{ _remote_keep_monthly }}
    dest: /etc/postgres-backup/remote.env
    owner: root
    group: postgres
    mode: "0640"
  when: _remote_enabled | bool
  no_log: true

- name: Install pg-backup script
  ansible.builtin.copy:
    src: pg-backup.sh
    dest: /usr/local/bin/pg-backup
    owner: root
    group: postgres
    mode: "0750"

- name: Install pg-backup-check script
  ansible.builtin.copy:
    src: pg-backup-check.sh
    dest: /usr/local/bin/pg-backup-check
    owner: root
    group: postgres
    mode: "0750"

- name: Render backup service unit (oneshot)
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/postgres-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Render backup timer unit (daily)
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/postgres-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Render backup-check service unit (oneshot)
  ansible.builtin.template:
    src: check.service.j2
    dest: /etc/systemd/system/postgres-backup-check.service
    owner: root
    group: root
    mode: "0644"

- name: Render backup-check timer unit (weekly)
  ansible.builtin.template:
    src: check.timer.j2
    dest: /etc/systemd/system/postgres-backup-check.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable + start the backup timer
  ansible.builtin.systemd:
    name: postgres-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  # Skipped under --check: the unit files aren't materialized in check mode, so
  # systemctl can't find the timer to enable it. Runs for real on deploy.
  when: not ansible_check_mode

- name: Enable + start the backup-check timer
  ansible.builtin.systemd:
    name: postgres-backup-check.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
