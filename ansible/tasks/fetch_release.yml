---
# Download CI-built artifacts straight from the GitHub Release onto the control
# node (the roles then copy them to the hosts). Self-contained: no make, no gh
# CLI — so the deploy playbooks run identically from a laptop or a CI runner.
# Skipped for artifact_source=local (deploy a local `make build-all`). Shared by
# playbooks/deploy.yml (prod) and playbooks/deploy-beta.yml.
- name: Fetch release artifacts
  when: artifact_source == 'release'
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Reset local artifact dir
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: "{{ item }}"
        mode: "0755"
      loop:
        - absent
        - directory

    - name: Resolve release metadata
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ github_repo }}/releases/{{
          'latest' if (release_tag | length == 0) else 'tags/' ~ release_tag }}
        headers: >-
          {{ {'Accept': 'application/vnd.github+json'}
             | combine({'Authorization': 'Bearer ' ~ github_token}
                       if github_token else {}) }}
        return_content: true
      register: _release

    - name: Report resolved release
      ansible.builtin.debug:
        msg: >-
          Deploying release {{ _release.json.tag_name }}
          ({{ _release.json.assets | length }} assets) from {{ github_repo }}

    - name: Assert the release carries a frontend dist
      ansible.builtin.assert:
        that:
          - _release.json.assets
            | selectattr('name', 'equalto', 'frontend-dist.tar.gz')
            | list | length > 0
        fail_msg: >-
          Release {{ _release.json.tag_name }} has no frontend-dist.tar.gz
          asset — re-run the release-artifacts workflow for this release.

    - name: Download release assets into build/
      ansible.builtin.get_url:
        url: "{{ item.browser_download_url }}"
        dest: "{{ build_dir }}/{{ item.name }}"
        mode: "0644"
      loop: "{{ _release.json.assets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create frontend dist dir
      ansible.builtin.file:
        path: "{{ frontend_dist_dir }}"
        state: directory
        mode: "0755"

    - name: Unpack frontend dist
      ansible.builtin.unarchive:
        src: "{{ build_dir }}/frontend-dist.tar.gz"
        dest: "{{ frontend_dist_dir }}"
        remote_src: true

- name: Assert build artifacts are present
  ansible.builtin.assert:
    that:
      - backend_wheel is string and backend_wheel | length > 0
      - engine_wheel is string and engine_wheel | length > 0
      - bot_wheel is string and bot_wheel | length > 0
    fail_msg: >-
      build/ is missing wheels. For artifact_source=release the Release has no
      attached wheels yet (run the release-artifacts workflow); for SOURCE=local
      run `make build-all` first.
  delegate_to: localhost
  become: false
  run_once: true
