---
- name: Deploy archon app (backend + frontend + bot)
  hosts: archon
  become: true
  gather_facts: false  # no deploy-path role reads gathered facts; saves the setup round trip

  vars_files:
    - ../vars/release_artifacts.yml

  # Quick lane: `--tags app` (QUICK=1 in the justfile) ships artifacts only —
  # the [app] roles below run whole, untagged provisioning roles are skipped.
  # Any nginx/TLS/db/unit change needs the full (default, untagged) deploy.
  pre_tasks:
    - name: Fetch release artifacts (shared)
      ansible.builtin.import_tasks: ../tasks/fetch_release.yml
      tags: [always]

  roles:
    # 1. TLS certs for main + bot domain (certbot webroot, idempotent)
    - role: nginx_tls
      r:
        server_name: "{{ domain_main }}"
        contact_email: "{{ contact_email }}"
    - role: nginx_tls
      r:
        server_name: "{{ domain_bot }}"
        contact_email: "{{ contact_email }}"

    # 2. Backend uvicorn service (localhost only; the static_site vhost proxies to it)
    - role: fastapi_backend
      tags: [app]
      r:
        service_name: "{{ backend_service }}"
        site_root: "{{ backend_site_root }}"
        port: "{{ backend_port }}"
        asgi_entrypoint: "backend.src.main:app"
        python_version: "{{ python_version }}"
        uv_python_install_dir: "{{ uv_python_install_dir }}"
        user: "{{ archon_user }}"
        group: "{{ archon_group }}"
        backend_wheel_src: "{{ backend_wheel }}"
        engine_wheel_src: "{{ engine_wheel }}"
        requirements_src: "{{ backend_requirements }}"
        env: "{{ backend_env }}"
        env_dir: "{{ env_dir }}"
        officials_contacts_vault: officials_contacts.json.prod.vault
        twda_key_vault: twda_github_app.pem.prod.vault
        feedback_key_vault: feedback_github_app.pem.prod.vault

    # 3. Frontend static site + nginx vhost for the main domain (proxies backend)
    - role: static_site
      tags: [app]
      r:
        server_name: "{{ domain_main }}"
        site_root: "{{ frontend_site_root }}"
        dist_src: "{{ frontend_dist_dir }}"
        owner: "{{ archon_user }}"
        group: "{{ archon_group }}"
        backend_port: "{{ backend_port }}"

    # 4. Discord bot service + nginx vhost on bot.<domain>
    - role: discord_bot
      tags: [app]
      r:
        service_name: "{{ bot_service }}"
        site_root: "{{ bot_site_root }}"
        bot_wheel_src: "{{ bot_wheel }}"
        requirements_src: "{{ bot_requirements }}"
        python_version: "{{ python_version }}"
        uv_python_install_dir: "{{ uv_python_install_dir }}"
        user: "{{ archon_user }}"
        group: "{{ archon_group }}"
        port: "{{ bot_port }}"
        server_name: "{{ domain_bot }}"
        state_dir: "{{ bot_state_dir }}"
        env: "{{ bot_env }}"
        env_dir: "{{ env_dir }}"

    # 5. Legacy-archon -> archon-vibe daily merge (parallel run, prod-only).
    # Gated by legacy_sync_enabled; runs the merge script with the deployed venv.
    # Remove at Phase-4 decommission.
    - role: legacy_sync
      when: legacy_sync_enabled | default(false) | bool
      r:
        service_name: archon-legacy-sync
        site_root: "{{ backend_site_root }}"
        user: "{{ archon_user }}"
        group: "{{ archon_group }}"
        env_dir: "{{ env_dir }}"
        script_src: "{{ playbook_dir }}/../../backend/scripts/migrate_from_archon.py"
        legacy_db_user: "{{ legacy_db_user }}"
        legacy_db_name: "{{ legacy_db_name }}"
        new_db_user: "{{ db_user }}"
        new_db_password: "{{ db_password }}"
        new_db_name: "{{ db_name }}"
        merge_backup_dir: "{{ merge_backup_dir | default('/var/lib/archon/merge-backups') }}"
        oncalendar: "{{ legacy_sync_oncalendar | default('*-*-* 04:00:00') }}"

    # 6. Daily cluster-wide DB backup (pg_dump of every DB — new `archon` AND
    # legacy `archondb` while the parallel run lasts) + weekly restore-verify.
    # Optional off-box push via restic -> S3. Gated by db_backup_enabled.
    - role: db_backup
      when: db_backup_enabled | default(false) | bool
      r:
        backup_dir: "{{ db_backup_dir | default('/var/backups/postgres') }}"
        retention_days: "{{ db_backup_retention_days | default(7) }}"
        oncalendar: "{{ db_backup_oncalendar | default('*-*-* 03:00:00') }}"
        check_oncalendar: "{{ db_backup_check_oncalendar | default('Sun *-*-* 06:00:00') }}"
        remote_enabled: "{{ db_backup_remote_enabled | default(false) }}"
        remote_bucket: "{{ db_backup_remote_bucket | default('') }}"
        remote_endpoint: "{{ db_backup_remote_endpoint | default('https://s3.fr-par.scw.cloud') }}"
        remote_keep_daily: "{{ db_backup_remote_keep_daily | default(7) }}"
        remote_keep_weekly: "{{ db_backup_remote_keep_weekly | default(4) }}"
        remote_keep_monthly: "{{ db_backup_remote_keep_monthly | default(12) }}"
        remote_access_key: "{{ vault_remote_backup_access_key | default('') }}"
        remote_secret_key: "{{ vault_remote_backup_secret_key | default('') }}"
        remote_restic_password: "{{ vault_remote_backup_restic_password | default('') }}"
        healthcheck_url: "{{ vault_db_backup_healthcheck_url | default('') }}"
        check_healthcheck_url: "{{ vault_db_backup_check_healthcheck_url | default('') }}"
