---
# One-shot PostgreSQL 16 -> 17 migration for prod.
# Runs pg_dumpall on the current 16 cluster, installs PG17 via PGDG, restores
# into it on port 5433, swaps ports. The 16 cluster is left stopped on disk
# for ~48h as a rollback path.
#
# SEQUENCING: run this BEFORE the Phase-1 stand-up (`just database-prod` /
# deploys). With PG16 still on 5432, apt puts the 17 cluster on 5433 while the
# postgresql role tasks and DATABASE_URL (unix socket, no port) silently
# target 5432 — i.e. the legacy cluster. Migrating first moves archondb to
# PG17 on 5432, then `just database-prod` creates the new archon db/user (and
# applies tunings) in that shared cluster. One cluster also halves PG RAM on
# the ~2GB box.
#
# Stops BOTH stacks around the dump: legacy archon (archon_web) keeps writing
# to the PG16 cluster being dumped and port-swapped otherwise (silent
# write-loss window). New-stack services may not exist yet at this point
# (pre-Phase-1) — stop/start tolerate that.
#
# After the swap, verify legacy archon runs clean on PG17 (plain JSONB,
# expected fine) before standing up the new stack.
#
# Run with: just migrate-postgres-prod
# Requires: PG16 already running, legacy archon running off it.

- name: "PG16 -> PG17 migration"
  hosts: archon
  become: true
  gather_facts: true
  vars:
    source_version: 16
    target_version: "{{ postgresql_version }}"
    target_port_tmp: 5433
    backup_path: "/var/lib/postgresql/backup-pre-pg{{ target_version }}-{{ ansible_date_time.date }}.sql"

  tasks:
    - name: Prompt for confirmation
      ansible.builtin.pause:
        prompt: >
          About to migrate PostgreSQL {{ source_version }} -> {{ target_version }} on
          {{ inventory_hostname }}. All archon services (legacy archon_web included)
          will be stopped. Continue? (y/N)
      register: confirm
    - name: Abort unless confirmed
      ansible.builtin.fail:
        msg: "Aborted by operator."
      when: confirm.user_input | default('') | lower != 'y'

    # Legacy archon first — it is the active writer on the PG16 cluster.
    # failed_when: false tolerates services that do not exist on this box yet
    # (the new stack lands at Phase 1, after this migration).
    - name: Stop archon services (legacy + new stack)
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ legacy_web_service }}"
        - "{{ backend_service }}"
        - "{{ bot_service }}"
      failed_when: false

    - name: Run pg_dumpall from source cluster {{ source_version }}
      ansible.builtin.command: >
        pg_dumpall --clean --if-exists --file={{ backup_path }}
      args:
        creates: "{{ backup_path }}"
      become: true
      become_user: postgres
      environment:
        PGPORT: "5432"

    - name: Install target PG cluster (parallel install, tmp port used below)
      ansible.builtin.include_role:
        name: postgresql

    # pg_conftool edits the named cluster's postgresql.conf directly — no
    # socket connection that could silently land on the OTHER cluster (a bare
    # postgresql_set here would connect to 5432 = the still-running PG16 and
    # write the port into ITS config, breaking the documented rollback path).
    - name: Point target cluster at temporary port {{ target_port_tmp }}
      ansible.builtin.command: >
        pg_conftool {{ target_version }} main set port {{ target_port_tmp }}
      changed_when: true

    - name: Restart target cluster on tmp port
      ansible.builtin.service:
        name: "postgresql@{{ target_version }}-main"
        state: restarted

    - name: Restore dump into target cluster {{ target_version }}
      ansible.builtin.command:
        argv:
          - psql
          - "-p"
          - "{{ target_port_tmp }}"
          - "-f"
          - "{{ backup_path }}"
          - postgres
      become: true
      become_user: postgres
      register: restore_output
      changed_when: true

    - name: Stop PG{{ source_version }}
      ansible.builtin.service:
        name: "postgresql@{{ source_version }}-main"
        state: stopped
        enabled: false

    - name: Point target cluster back to production port 5432
      ansible.builtin.command: >
        pg_conftool {{ target_version }} main set port 5432
      changed_when: true

    - name: Restart target cluster on production port 5432
      ansible.builtin.service:
        name: "postgresql@{{ target_version }}-main"
        state: restarted

    - name: Start archon services again (legacy + new stack)
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      loop:
        - "{{ legacy_web_service }}"
        - "{{ backend_service }}"
        - "{{ bot_service }}"
      failed_when: false

    - name: Migration done
      ansible.builtin.debug:
        msg: >
          PG{{ source_version }} stopped (still installed for 48h as rollback path).
          Backup dump: {{ backup_path }}.
          Verify legacy archon runs clean on PG{{ target_version }}, then run
          `just database-prod` to create the new archon db in this cluster.
          After ~48h of stable running, remove with:
          apt purge postgresql-{{ source_version }} && rm -rf /var/lib/postgresql/{{ source_version }}
