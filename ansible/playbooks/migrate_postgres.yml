---
# One-shot PostgreSQL 16 -> 17 migration for prod.
# Runs pg_dumpall on the current 16 cluster, installs PG17 via PGDG, restores
# into it on port 5433, swaps ports. The 16 cluster is left stopped on disk
# for ~48h as a rollback path.
#
# Run with: make migrate-postgres-prod
# Requires: PG16 already running, archon services running off it.

- name: "PG16 -> PG17 migration"
  hosts: archon
  become: true
  gather_facts: true
  vars:
    source_version: 16
    target_version: "{{ postgresql_version }}"
    target_port_tmp: 5433
    backup_path: "/var/lib/postgresql/backup-pre-pg{{ target_version }}-{{ ansible_date_time.date }}.sql"

  tasks:
    - name: Prompt for confirmation
      ansible.builtin.pause:
        prompt: >
          About to migrate PostgreSQL {{ source_version }} -> {{ target_version }} on
          {{ inventory_hostname }}. All archon services will be stopped. Continue? (y/N)
      register: confirm
    - name: Abort unless confirmed
      ansible.builtin.fail:
        msg: "Aborted by operator."
      when: confirm.user_input | default('') | lower != 'y'

    - name: Stop archon services
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ backend_service }}"
        - "{{ bot_service }}"
      failed_when: false

    - name: Run pg_dumpall from source cluster {{ source_version }}
      ansible.builtin.command: >
        pg_dumpall --clean --if-exists --file={{ backup_path }}
      args:
        creates: "{{ backup_path }}"
      become: true
      become_user: postgres
      environment:
        PGPORT: "5432"

    - name: Install target PG cluster (parallel install, tmp port used below)
      ansible.builtin.include_role:
        name: postgresql

    - name: Point target cluster at temporary port {{ target_port_tmp }}
      community.postgresql.postgresql_set:
        db: postgres
        login_unix_socket: "/var/run/postgresql"
        name: port
        value: "{{ target_port_tmp }}"
      become: true
      become_user: postgres

    - name: Restart target cluster on tmp port
      ansible.builtin.service:
        name: "postgresql@{{ target_version }}-main"
        state: restarted

    - name: Restore dump into target cluster {{ target_version }}
      ansible.builtin.command:
        argv:
          - psql
          - "-p"
          - "{{ target_port_tmp }}"
          - "-f"
          - "{{ backup_path }}"
          - postgres
      become: true
      become_user: postgres
      register: restore_output
      changed_when: true

    - name: Stop PG{{ source_version }}
      ansible.builtin.service:
        name: "postgresql@{{ source_version }}-main"
        state: stopped
        enabled: false

    - name: Point target cluster back to production port 5432
      community.postgresql.postgresql_set:
        db: postgres
        login_unix_socket: "/var/run/postgresql"
        name: port
        value: "5432"
      become: true
      become_user: postgres
      environment:
        PGPORT: "{{ target_port_tmp }}"

    - name: Restart target cluster on production port 5432
      ansible.builtin.service:
        name: "postgresql@{{ target_version }}-main"
        state: restarted

    - name: Start archon services again
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      loop:
        - "{{ backend_service }}"
        - "{{ bot_service }}"

    - name: Migration done
      ansible.builtin.debug:
        msg: >
          PG{{ source_version }} stopped (still installed for 48h as rollback path).
          Backup dump: {{ backup_path }}.
          After ~48h of stable running, remove with:
          apt purge postgresql-{{ source_version }} && rm -rf /var/lib/postgresql/{{ source_version }}
