[defaults]
inventory = inventories/beta
roles_path = roles
collections_path = ~/.ansible/collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
forks = 10
interpreter_python = auto_silent
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600
; Set ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass in your shell (or use --vault-password-file)
; rather than hard-coding it here — keeps the config usable without a vault pass file.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30

[inventory]
enable_plugins = ini, yaml
