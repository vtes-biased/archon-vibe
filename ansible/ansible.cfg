[defaults]
roles_path = roles
collections_path = galaxy_collections   ; `just galaxy` installs requirements.yml here (incl. lionel_panhaleux.server_setup)
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml   ; YAML-format task results via the builtin default callback (the community.general.yaml callback was removed in general 12.0.0)
forks = 10
interpreter_python = auto_silent
gathering = smart
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer   ; per-task timings + total — keep: every run doubles as a profile
; Set ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass in your shell (or use --vault-password-file)
; rather than hard-coding it here — keeps the config usable without a vault pass file.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
