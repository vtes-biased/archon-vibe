---
collections:
  - name: community.postgresql
    version: ">=3.10.0,<4.0.0"
  - name: community.general
    version: ">=10.0.0,<12.0.0"
  - name: ansible.posix
    version: ">=1.6.2,<3.0.0"

roles:
  # Shared server foundation. Provides the reusable nginx_site (proxy/spa/static)
  # and postgres_db roles consumed by the beta (frankfurt) deploy. `make galaxy`
  # installs it into galaxy_roles/ (git-ignored); ansible.cfg's roles_path points
  # at galaxy_roles/server-setup/roles so the roles resolve as nginx_site /
  # postgres_db. Pin to a tag/SHA once server-setup cuts releases.
  - src: https://github.com/lionel-panhaleux/server-setup.git
    name: server-setup
    version: main
