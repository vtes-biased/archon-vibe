[project]
name = "archon"
version = "0.1.0"
description = "VEKN community and tournament management system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "msgspec>=0.19.0",
    "psycopg[binary]>=3.2.3",
    "psycopg-pool>=3.2.3",
    "aiohttp>=3.10.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "webauthn>=2.0.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# only-include (not `packages`, which would collapse to a generic top-level `src`)
# ships backend/src at its full path → importable as `backend.src`, matching the
# ansible ExecStart and dev uvicorn entrypoint (backend.src.main:app). Excludes
# tests/scripts (only backend/src ships).
only-include = ["backend/src"]

# cards.json is generated outside the package (engine/data); bundle it as package
# data (under backend/src so it sits inside the backend.src package).
[tool.hatch.build.targets.wheel.force-include]
"engine/data/cards.json" = "backend/src/data/cards.json"

[tool.ruff]
line-length = 88
# Source-syntax floor, deliberately kept one below requires-python (3.14). Bumping
# to py314 makes the formatter rewrite `except (A, B):` -> `except A, B:` (PEP 758,
# 3.14-only and visually identical to a Py2 syntax error) across the codebase. We
# run on 3.14 but keep the source conventional/portable — don't raise this to py314.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # Depends() in default args is standard FastAPI
]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*" = ["E402"]  # sys.path manipulation before imports
"backend/tests/conftest.py" = ["E402"]
"backend/tests/test_timer_and_judge_call.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
# engine/ contains archon_engine.pyi stub for the Rust PyO3 module
[tool.ty.environment]
extra-paths = ["engine"]
# msgspec.Struct not recognized as dataclass — always false positive
[tool.ty.rules]
dataclass-field-order = "ignore"

[dependency-groups]
dev = [
    "maturin>=1.12.4",
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # ansible deploy (see ansible/README.md)
    "ansible-core>=2.17",
    "ansible-lint>=25.0",
    "yamllint>=1.35",
]
